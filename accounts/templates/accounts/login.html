{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Вход</h3>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>

                <hr class="my-3">
                <p class="text-center text-muted">Или войдите через:</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'social:begin' 'github' %}" class="btn btn-dark">
                        <i class="bi bi-github"></i> GitHub
                    </a>
                    <a href="{% url 'social:begin' 'vk-oauth2' %}" class="btn btn-primary">
                        <i class="bi bi-vk"></i> VK
                    </a>
                </div>

                <p class="mt-3 text-center">
                    <a href="{% url 'password_reset' %}">Забыли пароль?</a> |
                    <a href="{% url 'register' %}">Регистрация</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
