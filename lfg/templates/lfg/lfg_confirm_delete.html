{% extends "base.html" %}
{% block title %}Удаление объявления{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h3>Удалить объявление "{{ post.title }}"?</h3>
        <p>Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'lfg_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
